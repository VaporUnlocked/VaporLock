<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; media-src 'none'; manifest-src 'none'">
  <title>Vapor Lock</title>
  <link rel="stylesheet" href="native-demo.css">
  <link rel="stylesheet" href="native-renderer.css">
  <link rel="stylesheet" href="native-component-renderer.css">
  <style>
    .vl-live-fields {display:flex;flex-direction:column;gap:12px;min-width:0;padding:16px;background:var(--vl-panel);color:var(--vl-text);border:1px solid var(--vl-border);font-size:calc(14px * var(--vl-accessibility-text-scale,1));}
    .vl-live-fields label {display:flex;flex-wrap:wrap;align-items:center;gap:8px;overflow-wrap:anywhere;}
    .vl-live-fields :is(input,select,button) {font:inherit;min-height:2.5em;max-width:100%;color:var(--vl-text);background:var(--vl-background);border:1px solid var(--vl-border);padding:6px;box-sizing:border-box;}
    .vl-live-fields :is(input,select) {flex:1 1 180px;min-width:0;}
    .vl-live-fields button {white-space:normal;overflow-wrap:anywhere;}
    .vl-live-fields :focus-visible {outline:3px solid #7dbcf5;outline-offset:2px;}
    .vl-live-fields :disabled {opacity:.65;}
    .vl-live-palette {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;}
    .vl-live-context {min-width:0;white-space:normal;overflow-wrap:anywhere;border:2px solid #708498;background:#111823;color:#f2f6fa;padding:12px;font-size:calc(14px * var(--vl-accessibility-text-scale,1));line-height:1.5;}
    .vl-live-pipeline-section,.vl-live-partial-diagnostics {min-width:0;padding:16px;border:1px solid var(--vl-border);background:var(--vl-panel);color:var(--vl-text);overflow-wrap:anywhere;line-height:1.5;}
    .vl-live-pipeline-section h2,.vl-live-partial-diagnostics h2 {margin:0 0 12px;font-size:calc(16px * var(--vl-accessibility-text-scale,1));}
    .vl-live-pipeline {margin:0 0 16px;white-space:pre-line;}
    .vl-live-pipeline-section button {max-width:100%;white-space:normal;}
    .vl-live-partial-diagnostics .vl-live-unconnected-help {margin:0 0 12px;}
    #live-error {color:#ffffff;background:#842b39;padding:12px;white-space:normal;overflow-wrap:anywhere;}
    .vl-live-unknown-canvas {min-height:64px;padding:12px;color:#f2f6fa;background:#111823;}
  </style>
  <script src="qwebchannel.js"></script>
  <script type="module" src="live-adapter.js"></script>
</head>
<body>
  <div id="mount" aria-busy="true"></div>
  <p id="live-error" role="alert" hidden></p>
</body>
</html>
